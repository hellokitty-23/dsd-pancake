name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcode-select -p
          swift --version

      - name: Build release executable
        run: swift build -c release --product DSHDesktop

      - name: Run controlled verification
        run: swift run -c release DSHDesktopVerification --skip-current-external-probe

      - name: Check packaging scripts
        run: |
          zsh -n scripts/local-release/build-app.zsh
          zsh -n scripts/local-release/verify-app.zsh

      - name: Build and inspect local App bundle
        run: |
          ./scripts/local-release/build-app.zsh
          ./scripts/local-release/verify-app.zsh "local-release/DSD Pancake.app"
